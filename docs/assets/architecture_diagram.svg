<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #060911; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
