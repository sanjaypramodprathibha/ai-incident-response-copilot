<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%" style="background-color: #060911; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="fastapi-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="inner-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= HEADER SECTION ================= -->
  <rect x="40" y="25" width="1320" height="95" rx="14" fill="url(#header-bg)" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Main Title -->
  <text x="70" y="62" fill="#00f0ff" font-size="28" font-weight="900" letter-spacing="0.5">🛡️ AI INCIDENT RESPONSE &amp; SECOPS COPILOT</text>
  
  <!-- Subtitle -->
  <text x="70" y="92" fill="#cbd5e1" font-size="17" font-weight="700">Enterprise Security Operations Platform Architecture</text>

  <!-- Tech Badges on Header Right -->
  <g transform="translate(740, 48)">
    <!-- Python -->
    <rect x="0" y="0" width="85" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="42.5" y="20" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">🐍 Python</text>

    <!-- FastAPI -->
    <rect x="95" y="0" width="85" height="30" rx="15" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="137.5" y="20" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">⚡ FastAPI</text>

    <!-- Gemini AI -->
    <rect x="190" y="0" width="95" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="237.5" y="20" fill="#c084fc" font-size="13" font-weight="800" text-anchor="middle">🤖 Gemini AI</text>

    <!-- MITRE -->
    <rect x="295" y="0" width="90" height="30" rx="15" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="340" y="20" fill="#fb7185" font-size="13" font-weight="800" text-anchor="middle">🎯 MITRE v14</text>

    <!-- STIX 2.1 -->
    <rect x="395" y="0" width="90" height="30" rx="15" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="440" y="20" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="middle">🛡️ STIX 2.1</text>
  </g>


  <!-- ================= 1. TELEMETRY INGESTION LAYER (TOP) ================= -->
  <rect x="40" y="140" width="1320" height="120" rx="14" fill="url(#card-bg)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="152" width="280" height="32" rx="6" fill="#1e293b"/>
  <text x="195" y="174" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">📥 Telemetry &amp; Log Ingestion Layer</text>

  <g transform="translate(60, 195)">
    <!-- Sentinel -->
    <rect x="0" y="0" width="195" height="50" rx="8" fill="url(#inner-box)" stroke="#475569" stroke-width="1.5"/>
    <text x="97.5" y="22" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Microsoft Sentinel</text>
    <text x="97.5" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">Cloud SIEM Alerts</text>

    <!-- CrowdStrike -->
    <rect x="215" y="0" width="195" height="50" rx="8" fill="url(#inner-box)" stroke="#475569" stroke-width="1.5"/>
    <text x="312.5" y="22" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">CrowdStrike Falcon</text>
    <text x="312.5" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">EDR Detections</text>

    <!-- Splunk -->
    <rect x="430" y="0" width="195" height="50" rx="8" fill="url(#inner-box)" stroke="#475569" stroke-width="1.5"/>
    <text x="527.5" y="22" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Splunk Enterprise</text>
    <text x="527.5" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">Security Audit Logs</text>

    <!-- Suricata -->
    <rect x="645" y="0" width="195" height="50" rx="8" fill="url(#inner-box)" stroke="#475569" stroke-width="1.5"/>
    <text x="742.5" y="22" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Suricata / Snort</text>
    <text x="742.5" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">Network NIDS Logs</text>

    <!-- PAN-OS -->
    <rect x="860" y="0" width="195" height="50" rx="8" fill="url(#inner-box)" stroke="#475569" stroke-width="1.5"/>
    <text x="957.5" y="22" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Palo Alto PAN-OS</text>
    <text x="957.5" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">Firewall Security Feeds</text>

    <!-- Batch Files -->
    <rect x="1075" y="0" width="200" height="50" rx="8" fill="url(#inner-box)" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="1175" y="22" fill="#00f0ff" font-size="14" font-weight="800" text-anchor="middle">📁 Batch File Manager</text>
    <text x="1175" y="38" fill="#cbd5e1" font-size="12" text-anchor="middle">JSON, CSV &amp; Raw Logs</text>
  </g>


  <!-- DOWN ARROW 1 -->
  <path d="M 700 260 L 700 290" stroke="#00f0ff" stroke-width="3.5" stroke-dasharray="6 6"/>
  <polygon points="700,300 692,286 708,286" fill="#00f0ff"/>


  <!-- ================= 2. DOMINANT FASTAPI BACKEND CORE (CENTER) ================= -->
  <rect x="40" y="305" width="1320" height="350" rx="16" fill="url(#card-bg)" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  
  <!-- Core Title Banner -->
  <rect x="60" y="320" width="1280" height="48" rx="8" fill="#0284c7"/>
  <text x="700" y="352" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ FASTAPI CORE BACKEND &amp; ANALYSIS ENGINE (App / Services)</text>

  <!-- 4 Clean Modules (Larger Text, 4 Bullets Each) -->
  <g transform="translate(65, 385)">
    <!-- Module 1: Analysis & Risk Engine -->
    <rect x="0" y="0" width="300" height="250" rx="12" fill="url(#inner-box)" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="35" fill="#38bdf8" font-size="17" font-weight="900">🎯 Analysis &amp; Risk Engine</text>

    <text x="20" y="75" fill="#ffffff" font-size="15" font-weight="700">• Risk Scoring (0–100 Engine)</text>
    <text x="20" y="105" fill="#ffffff" font-size="15" font-weight="700">• Priority Classifier (Critical/High)</text>
    <text x="20" y="135" fill="#ffffff" font-size="15" font-weight="700">• MITRE ATT&amp;CK v14 Mapping</text>
    <text x="20" y="165" fill="#ffffff" font-size="15" font-weight="700">• IOC Auto-Extraction (IP/Hash)</text>
    <text x="20" y="195" fill="#ffffff" font-size="15" font-weight="700">• Schema Normalization Pipeline</text>

    <!-- Module 2: Live CTI Engine -->
    <rect x="320" y="0" width="300" height="250" rx="12" fill="url(#inner-box)" stroke="#34d399" stroke-width="2"/>
    <text x="340" y="35" fill="#34d399" font-size="17" font-weight="900">🌐 Threat Intel Pipeline</text>

    <text x="340" y="75" fill="#ffffff" font-size="15" font-weight="700">• AbuseIPDB v2 REST Integration</text>
    <text x="340" y="105" fill="#ffffff" font-size="15" font-weight="700">• VirusTotal v3 REST Integration</text>
    <text x="340" y="135" fill="#ffffff" font-size="15" font-weight="700">• 90+ Security Vendor Engines</text>
    <text x="340" y="165" fill="#ffffff" font-size="15" font-weight="700">• Zero-Crash Local Fallback</text>
    <text x="340" y="195" fill="#ffffff" font-size="15" font-weight="700">• Dynamic Telemetry Status Badges</text>

    <!-- Module 3: SOAR Playbook Engine -->
    <rect x="640" y="0" width="300" height="250" rx="12" fill="url(#inner-box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="660" y="35" fill="#fbbf24" font-size="17" font-weight="900">⚡ SOAR Playbook Generator</text>

    <text x="660" y="75" fill="#ffffff" font-size="15" font-weight="700">• PowerShell (New-NetFirewallRule)</text>
    <text x="660" y="105" fill="#ffffff" font-size="15" font-weight="700">• Linux Bash (iptables &amp; pkill)</text>
    <text x="660" y="135" fill="#ffffff" font-size="15" font-weight="700">• Palo Alto PAN-OS CLI Commands</text>
    <text x="660" y="165" fill="#ffffff" font-size="15" font-weight="700">• Cisco ASA Firewall Access-Lists</text>
    <text x="660" y="195" fill="#ffffff" font-size="15" font-weight="700">• 1-Click Code Tab Viewer &amp; Copy</text>

    <!-- Module 4: STIX 2.1 & Reports -->
    <rect x="960" y="0" width="300" height="250" rx="12" fill="url(#inner-box)" stroke="#f472b6" stroke-width="2"/>
    <text x="980" y="35" fill="#f472b6" font-size="17" font-weight="900">🛡️ STIX 2.1 &amp; Reports</text>

    <text x="980" y="75" fill="#ffffff" font-size="15" font-weight="700">• OASIS STIX 2.1 JSON Export</text>
    <text x="980" y="105" fill="#ffffff" font-size="15" font-weight="700">• CISO Executive PDF Engine</text>
    <text x="980" y="135" fill="#ffffff" font-size="15" font-weight="700">• Markdown Report Exporter</text>
    <text x="980" y="165" fill="#ffffff" font-size="15" font-weight="700">• Timeline Audit Trail Logger</text>
    <text x="980" y="195" fill="#ffffff" font-size="15" font-weight="700">• SIEM &amp; MISP Interoperability</text>
  </g>


  <!-- THREE DOWN ARROWS -->
  <!-- Left Arrow -->
  <path d="M 260 655 L 260 685" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="260,693 253,681 267,681" fill="#38bdf8"/>

  <!-- Middle Arrow -->
  <path d="M 700 655 L 700 685" stroke="#c084fc" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="700,693 693,681 707,681" fill="#c084fc"/>

  <!-- Right Arrow -->
  <path d="M 1140 655 L 1140 685" stroke="#34d399" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="1140,693 1133,681 1147,681" fill="#34d399"/>


  <!-- ================= 3. BOTTOM ROW: STORAGE, UI & LIVE INTEGRATIONS ================= -->
  
  <!-- Left Box: SQLite Storage -->
  <g transform="translate(40, 695)">
    <rect x="0" y="0" width="420" height="235" rx="14" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="390" height="34" rx="6" fill="#1e293b"/>
    <text x="210" y="38" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle">💾 SQLite Storage Layer (store.py)</text>

    <text x="25" y="80" fill="#ffffff" font-size="15" font-weight="700">• Incidents Database (incidents.db)</text>
    <text x="25" y="112" fill="#ffffff" font-size="15" font-weight="700">• Audit Trail Logger &amp; Timeline</text>
    <text x="25" y="144" fill="#ffffff" font-size="15" font-weight="700">• Source File Batch Tracking</text>
    <text x="25" y="176" fill="#ffffff" font-size="15" font-weight="700">• Single &amp; Bulk File Purge API</text>
    <text x="25" y="208" fill="#ffffff" font-size="15" font-weight="700">• Local-First Zero Dependency DB</text>
  </g>

  <!-- Middle Box: Gemini AI & Web UX -->
  <g transform="translate(490, 695)">
    <rect x="0" y="0" width="420" height="235" rx="14" fill="url(#card-bg)" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="390" height="34" rx="6" fill="#581c87"/>
    <text x="210" y="38" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">🤖 Gemini AI Copilot &amp; Web UX</text>

    <text x="25" y="80" fill="#ffffff" font-size="15" font-weight="700">• Google Gemini AI Prompt Router</text>
    <text x="25" y="112" fill="#ffffff" font-size="15" font-weight="700">• 4-Part Assessment &amp; Q&amp;A Agent</text>
    <text x="25" y="144" fill="#ffffff" font-size="15" font-weight="700">• Streaming Typewriter Animation</text>
    <text x="25" y="176" fill="#ffffff" font-size="15" font-weight="700">• Glassmorphic Dark Obsidian UI</text>
    <text x="25" y="208" fill="#ffffff" font-size="15" font-weight="700">• Interactive ATT&amp;CK Heatmap Matrix</text>
  </g>

  <!-- Right Box: Live External Integrations -->
  <g transform="translate(940, 695)">
    <rect x="0" y="0" width="420" height="235" rx="14" fill="url(#card-bg)" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="390" height="34" rx="6" fill="#064e3b"/>
    <text x="210" y="38" fill="#34d399" font-size="16" font-weight="900" text-anchor="middle">🌐 Live External Integrations</text>

    <!-- VirusTotal -->
    <rect x="25" y="65" width="370" height="42" rx="8" fill="url(#inner-box)" stroke="#10b981" stroke-width="1.5"/>
    <text x="40" y="91" fill="#34d399" font-size="15" font-weight="900">🟢 VirusTotal v3 REST API</text>
    <text x="250" y="91" fill="#cbd5e1" font-size="13">90+ Security Engines</text>

    <!-- AbuseIPDB -->
    <rect x="25" y="118" width="370" height="42" rx="8" fill="url(#inner-box)" stroke="#10b981" stroke-width="1.5"/>
    <text x="40" y="144" fill="#34d399" font-size="15" font-weight="900">🟢 AbuseIPDB v2 REST API</text>
    <text x="250" y="144" fill="#cbd5e1" font-size="13">IP Reputation Scoring</text>

    <!-- Gemini API -->
    <rect x="25" y="171" width="370" height="42" rx="8" fill="url(#inner-box)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="40" y="197" fill="#c084fc" font-size="15" font-weight="900">🟢 Google Gemini AI API</text>
    <text x="250" y="197" fill="#cbd5e1" font-size="13">GenAI Narrative Engine</text>
  </g>
</svg>
